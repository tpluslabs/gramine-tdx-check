name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Lint scripts
        run: |
          bash -n check.sh check-tdx.sh install.sh install-tdx.sh lib.sh
          shellcheck -S error -x check.sh check-tdx.sh install.sh install-tdx.sh run.sh lib.sh

      - name: Build static probe
        run: |
          gcc -O2 -Wall -Werror -static -o sgx-cpuid-linux-amd64 probe/sgx-cpuid.c
          gcc -O2 -Wall -Werror -fsyntax-only app/hello.c
          ./sgx-cpuid-linux-amd64
          sha256sum sgx-cpuid-linux-amd64 > sgx-cpuid-linux-amd64.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: sgx-cpuid-linux-amd64
          path: sgx-cpuid-linux-amd64*

      # Rolling "latest" prerelease: check.sh downloads the probe from here when the host has no cc.
      - name: Publish latest
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest && git push -f origin latest
          gh release view latest >/dev/null 2>&1 ||
            gh release create latest --prerelease --title latest --notes ""
          gh release upload latest sgx-cpuid-linux-amd64 sgx-cpuid-linux-amd64.sha256 --clobber
          gh release edit latest --notes "Built from ${GITHUB_SHA}"

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" sgx-cpuid-linux-amd64 sgx-cpuid-linux-amd64.sha256 --generate-notes
